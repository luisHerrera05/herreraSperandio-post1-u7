<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Tareas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #065A82; color: white; }
        tr:nth-child(even) { background: #f5f5f5; }
        .completada { text-decoration: line-through; color: #888; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn-edit { background: #1C7293; color: white; }
        .btn-del  { background: #C62828; color: white; }
        .btn-ok   { background: #2E7D32; color: white; }
        .btn-new  { background: #21295C; color: white; margin-bottom: 1rem; display: inline-block; }
        form.inline { display: inline; }
        .filtros select { padding: 6px; margin-right: 0.5rem; }
    </style>
</head>
<body>
    <h1>Gestión de Tareas</h1>
    <a th:href="@{/tareas/nueva}" class="btn btn-new">+ Nueva Tarea</a>

    <!-- Filtros vía @RequestParam: al cambiar cualquier select se reenvía el formulario GET -->
    <form th:action="@{/tareas}" method="get" class="filtros">
        <select name="prioridad" onchange="this.form.submit()">
            <option value="">Todas las prioridades</option>
            <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"
                    th:selected="${p == prioridadSeleccionada}"></option>
        </select>
        <select name="completada" onchange="this.form.submit()">
            <option value="">Todos los estados</option>
            <option value="false" th:selected="${completadaSeleccionada != null and !completadaSeleccionada}">Pendientes</option>
            <option value="true" th:selected="${completadaSeleccionada != null and completadaSeleccionada}">Completadas</option>
        </select>
    </form>

    <table>
        <thead>
            <tr><th>ID</th><th>Título</th><th>Prioridad</th><th>Fecha límite</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tareas}" th:classappend="${t.completada} ? 'completada' : ''">
                <td th:text="${t.id}"></td>
                <td th:text="${t.titulo}"></td>
                <td th:text="${t.prioridad}"></td>
                <td th:text="${t.fechaLimite}"></td>
                <td th:text="${t.completada} ? 'Completada' : 'Pendiente'"></td>
                <td>
                    <a th:href="@{/tareas/{id}/editar(id=${t.id})}" class="btn btn-edit">Editar</a>
                    <form th:if="${!t.completada}" class="inline" method="post"
                          th:action="@{/tareas/{id}/completar(id=${t.id})}">
                        <button type="submit" class="btn btn-ok">Completar</button>
                    </form>
                    <form class="inline" method="post" th:action="@{/tareas/{id}/eliminar(id=${t.id})}"
                          onsubmit="return confirm('¿Eliminar esta tarea?')">
                        <button type="submit" class="btn btn-del">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tareas)}">
                <td colspan="6" style="text-align:center">No hay tareas que coincidan con el filtro.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
